# Build + publish bridge binaries for the opencode-web-bridges plugin.
#
# GoReleaser-free: `go build` matrix for the 6 platform/arch pairs, both
# binaries, sha256 checksums.txt, uploaded to the GitHub release on tag push.
# Cross-compiled from ubuntu-latest (CGO_ENABLED=0) — no Windows runner needed.
#
# Asset naming convention (consumed by the plugin's binaries.ts):
#   <binary>-<goos>-<goarch>[.exe]   (windows assets gain `.exe`)
# e.g. gemini-openai-darwin-arm64, gemini-proxy-linux-amd64,
#      gemini-proxy-windows-amd64.exe
# plus a checksums.txt with `sha256  <asset>` lines (sha256sum format).
name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build both binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # Windows assets gain `.exe` (Go convention; matches binaries.ts assetName).
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "dist/gemini-openai-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/gemini-openai
          go build -o "dist/gemini-proxy-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/gemini-mcp

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Write checksums.txt
        run: |
          cd dist
          sha256sum gemini-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Bridge binaries for gemini-proxy (gemini-openai + gemini-proxy, 6 platform/arch pairs, sha256 checksums.txt)." \
            dist/*
