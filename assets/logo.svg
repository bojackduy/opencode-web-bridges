  <!-- struts -->
  <line x1="192" y1="200" x2="192" y2="256" stroke="#6366f1" stroke-width="6" opacity="0.7"/>
  <line x1="256" y1="150" x2="256" y2="256" stroke="#6366f1" stroke-width="6" opacity="0.7"/>
  <line x1="320" y1="200" x2="320" y2="256" stroke="#6366f1" stroke-width="6" opacity="0.7"/>
</svg>
